          <polyline points="165.49,222.95 175.99,222.95 186.49,222.95" stroke="#7f7f7f" stroke-width="5" fill="none" id="svg_53"/>
          <ellipse fill="#7f7f7f" stroke="#7f7f7f" stroke-width="1.2" cx="165.89" cy="222.9" rx="2.1" ry="1.85" id="svg_54"/>
         </g>
        </g>

        <!-- Pipes connecting the diverter valve to the plate heat exchanger. -->
        <path d="m169.69,213.48l0,13.3" class="pipe hot" id="svg_68"/>
        <path d="m203.51,218.77l0,43.03" class="pipe hot" id="svg_71" transform="rotate(90, 203.514, 240.287)"/>

        <!-- Diverter valve symbol. -->
        <g id="svg_67" transform="rotate(-90, 172.719, 240.624) matrix(0.999999, 7.41781e-09, -7.41781e-09, 0.999999, 49.674, -3.41476)">
