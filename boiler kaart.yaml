        <rect x="114.76" y="375.61" width="44" height="66" rx="21" fill="#ff0000" stroke="#9eafc0" stroke-width="1.5" id="svg_38"/>
        <path d="m118.62,411.49l36,0" stroke="#c6d0db" stroke-width="1.5" id="svg_39"/>
