      // Replace the text inside a specific SVG text element.
      const replaceText = (id, value) => {
        const re = new RegExp('(<text\\b[^>]*\\bid="' + id + '"[^>]*>)[\\s\\S]*?(</text>)');
        svg = svg.replace(re, '$1' + value + '$2');
      };

      // Update the central heating temperatures and temperature difference.
      replaceText('svg_95', fmt('sensor.boiler_current_flow_temperature', 1) + '°');
      replaceText('svg_96', fmt('sensor.boiler_return_temperature', 1) + '°');
      replaceText('svg_98', '△ ' + delta);

      // Update domestic hot water temperature and flow values.
      replaceText('svg_101', dhw);
      replaceText('svg_103', tapFlow);
      replaceText('svg_110', totalWaterFlow);

      // Update system pressure, pump modulation, and burner power.
      replaceText('svg_43', pressure);
      replaceText('svg_61', pressureUnit);
      replaceText('svg_112', pumpMod);
      replaceText('svg_114', burnerPower);

      // Apply dynamic colors and animation states to the SVG.
      svg = svg
        // Change the burner appearance according to the flame state.
        .replaceAll('__BURNER_FILL__', flameOn ? '#f18a2f' : '#a3a3a3')
        .replaceAll('__BURNER_STROKE__', flameOn ? '#d56a17' : '#7f7f7f')
        .replaceAll('__FLAME_FILL__', flameOn ? '#fff1b7' : '#c7c7c7')

        // Change the pump housing color according to the pump state.
        .replaceAll('__PUMP_BG__', pumpOn ? '#168bea' : '#a0a0a0')

        // Show the radiator glow only during central heating operation.
        .replaceAll('__RADIATOR_GLOW__', heatingOn && !dhwOn ? '0.25' : '0')

        // Start the pump animation only while a pump is active.
        .replaceAll('__PUMP_BEGIN__', pumpOn ? '0s' : 'indefinite')

        // Rotate the fan only when the fan sensor reports that it is running.
        .replaceAll('__FAN_ANIM_CLASS__', fanOn ? 'tnt-spin' : '')

        // Enable or disable the central heating flow animations.
        .replaceAll('__CV_HOT_OPACITY__', cvFlowOn ? '1' : '0')
        .replaceAll('__CV_COLD_OPACITY__', cvFlowOn ? '1' : '0')

        // Enable or disable the gas flow animation.
        .replaceAll('__GAS_OPACITY__', gasOn ? '1' : '0')

        // Enable or disable domestic hot water flow animations.
        .replaceAll('__DHW_COLD_OPACITY__', dhwFlowOn ? '1' : '0')
        .replaceAll('__DHW_HOT_OPACITY__', dhwFlowOn ? '1' : '0')

        // Show the tap water stream only when domestic hot water is active.
        .replaceAll('__TAP_WATER_CLASS__', (dhwOn || dhwFlowOn) ? '' : 'tnt-off');

      // Return the completed SVG to the Home Assistant card.
      return svg;
    ]]]
