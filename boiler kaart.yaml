        <path d="m136.75,396.61l6,-6" stroke="#e3a51d" stroke-width="2" stroke-linecap="round" id="svg_41"/>
        <circle cx="136.76" cy="396.61" r="2" fill="#e3a51d" id="svg_42"/>
        <path d="m120.77,351.01l0,31.69" class="pipe cold" id="svg_56" transform="rotate(90.0111, 120.765, 366.853)"/>

        <!-- Burner housing and flame. -->
        <rect x="110.74" y="159.12" width="52.51" height="39.67" rx="6" fill="__BURNER_FILL__" stroke="__BURNER_STROKE__" stroke-width="1.2" id="svg_21"/>
        <path d="m134.61,193.64c-15.06,-12.1 4.63,-20.57 -3.47,-30.25c22.01,13.31 17.37,24.2 3.47,30.25z" fill="__FLAME_FILL__" id="svg_22"/>

        <!-- Internal heat exchanger coil details. -->
        <g id="svg_57" transform="matrix(1, 0, 0, 1, -0.159479, -61.6586)">
