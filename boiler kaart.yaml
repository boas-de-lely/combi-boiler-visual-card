type: custom:button-card
show_name: false
show_icon: false
show_state: false
tap_action:
  action: none
styles:
  card:
    - background: transparent
    - border: none
    - box-shadow: none
    - padding: 0
    - overflow: visible
  grid:
    - grid-template-areas: '"visual"'
    - grid-template-columns: 1fr
  custom_fields:
    visual:
      - width: 100%
      - max-width: 100%
      - justify-self: stretch
      - align-self: center
custom_fields:
  visual: |
    [[[
      // Return the state of a Home Assistant entity.
      const state = (id) => states[id]?.state;

      // Check whether an entity has a usable state.
      const valid = (id) => {
        const s = state(id);
        return s !== undefined && s !== 'unknown' && s !== 'unavailable' && s !== '';
      };

      // Convert a valid entity state to a number.
      const number = (id) => valid(id) ? Number(state(id)) : NaN;

      // Format a numeric entity with a fixed number of decimals.
      const fmt = (id, decimals = 1, unit = '') => {
        const n = number(id);
        if (!Number.isFinite(n)) return '—';
        const shown = n.toFixed(decimals);
        return unit ? shown + unit : shown;
      };

      // Format an entity value using its Home Assistant unit.
      const stateWithUnit = (id, decimals = 0) => {
        if (!valid(id)) return '—';
        const n = Number(state(id));
        const unit = states[id]?.attributes?.unit_of_measurement || '';
        return Number.isFinite(n) ? n.toFixed(decimals) + unit : state(id);
      };

      // Read the central heating flow and return temperatures.
      const flow = number('sensor.boiler_current_flow_temperature');
      const ret = number('sensor.boiler_return_temperature');

      // Calculate the temperature difference between flow and return.
      const delta = Number.isFinite(flow) && Number.isFinite(ret)
        ? (flow - ret).toFixed(1) + '°'
        : '—';

      // Read the system pressure and its unit.
      const pressure = fmt('sensor.boiler_system_pressure', 1);
      const pressureUnit = states['sensor.boiler_system_pressure']?.attributes?.unit_of_measurement || 'bar';

      // Read the domestic hot water temperature.
      const dhw = fmt('sensor.boiler_dhw_current_intern_temperature', 1) + '°';

      // Read the domestic hot water flow rate and total water meter flow.
      const tapFlow = stateWithUnit('sensor.boiler_dhw_current_tap_water_flow', 1);
      const totalWaterFlow = stateWithUnit('sensor.watermeter_watermeter_flow', 1);
      const tapFlowValue = number('sensor.boiler_dhw_current_tap_water_flow');

      // Treat a tap water flow above 0.05 as active.
      const tapFlowActive = Number.isFinite(tapFlowValue) && tapFlowValue > 0.05;

      // Read pump modulation and current burner power.
      const pumpMod = stateWithUnit('sensor.boiler_heating_pump_modulation', 0);
      const burnerPower = stateWithUnit('sensor.boiler_burner_current_power', 0);

      // Determine whether gas is flowing and the burner flame is active.
      const gasOn = state('binary_sensor.boiler_gas') === 'on';
      const flameCurrent = number('sensor.boiler_flame_current');
      const flameOn = gasOn && Number.isFinite(flameCurrent) && flameCurrent > 0;

      // Read the central heating and domestic hot water operating states.
      const heatingOn = state('binary_sensor.boiler_heating_active') === 'on';
      const heatingPumpOn = state('binary_sensor.boiler_heating_pump') === 'on';
      const dhwOn = state('binary_sensor.boiler_dhw_active') === 'on';
      const dhwPumpOn = state('binary_sensor.boiler_dhw_charge_pump') === 'on';

      // The pump is considered active if either pump sensor is on.
      const pumpOn = heatingPumpOn || dhwPumpOn;

      // Read the fan state.
      const fanOn = state('binary_sensor.boiler_fan') === 'on';

      // Enable central heating flow only during central heating operation.
      const cvFlowOn = heatingOn && heatingPumpOn && !dhwOn;

      // Enable domestic hot water animations during hot water operation or tap flow.
      const dhwFlowOn = dhwOn || tapFlowActive;

      // Determine the current operating mode.
      const mode = dhwOn ? 'WARMTAPWATER' : (heatingOn ? 'CV-BEDRIJF' : 'STANDBY');

      // Build the boiler schematic and its animated pipework.
      let svg = `<svg viewBox="10 30 345 510" width="100%" height="auto" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;height:auto;max-width:none" xmlns="http://www.w3.org/2000/svg">
       <defs>
        <!-- Define the visual styles used throughout the schematic. -->
        <style>
          .txt { fill: #ffffff; }
          .muted { fill: #8a9bad; }
          .label { font-size: 10px; letter-spacing: .5px; }
          .value { fill: #ffffff; font-size: 10px; font-weight: 650; }
          .pipe { fill: none; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
          .hot { stroke: #f04432; }
          .cold { stroke: #168bea; }
          .gas { stroke: #f0bd16; }
          .sleek-spout { fill: none; stroke: #475569; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
          .sleek-highlight { fill: none; stroke: #94a3b8; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0.6; }
          .water-stream { fill: none; stroke: #38bdf8; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 4 4; opacity: 0.7; }
          .tnt-off { display: none !important; }
          .tnt-spin { animation: tnt-rotate 1s linear infinite; }
          @keyframes tnt-rotate { to { transform: rotate(360deg); } }
        </style>

        <!-- Style the animated flow dots and respect reduced-motion preferences. -->
        <style>
          .flow-dot {
            fill: #b9e7ff;
            opacity: 0.96;
            pointer-events: none;
            filter: drop-shadow(0 0 2px #60c8ff);
          }
          @media (prefers-reduced-motion: reduce) {
            .flow-dot { display: none; }
          }
        </style>

        <!-- Create the soft glow behind the radiator during heating. -->
        <filter id="svg_130_blur" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="10"/>
        </filter>
       </defs>

       <!-- Main drawing layer containing the complete boiler installation. -->
       <g class="layer" display="inline">
        <title>Nefit Trendline II Installation</title>

        <!-- Boiler casing and heating glow. -->
        <ellipse fill="#ff2a00" stroke="#ff7f00" stroke-width="1.2" stroke-dasharray="null" stroke-linejoin="null" stroke-linecap="null" cx="113.68" cy="490.23" rx="87.9" ry="57.01" id="svg_130" opacity="__RADIATOR_GLOW__" filter="url(#svg_130_blur)"/>
        <rect x="75" y="45.8" width="221.22" height="302.29" rx="11" fill="#f7f9fc" stroke="#c5cfda" stroke-width="1.5" id="svg_15"/>

        <!-- Upper internal connections. -->
        <g id="svg_129">
         <path d="m205.03,161.38l0,22.27" class="pipe cold" id="svg_90"/>
         <path d="m195.74,152.24l0,18.12" class="pipe cold" id="svg_91" transform="rotate(90.0111, 195.741, 161.299)"/>
        </g>

        <!-- Central heating flow pipes. -->
        <g id="svg_128">
