         <path d="m169.58,253.47l0,21.75" class="pipe hot" id="svg_70"/>
        </g>

        <!-- Central heating return pipes and the lower heat exchanger connection. -->
        <g id="svg_127">
         <path d="m204.88,219.15l0,97.73" class="pipe cold" id="svg_60"/>
         <path d="m101.62,318.17l0,142.87" class="pipe cold" id="svg_8"/>
         <path d="m153.03,265.49l0,102.93" class="pipe cold" id="svg_59" transform="rotate(90.0111, 153.031, 316.954)"/>
         <path d="m215.69,280.4l0,18.39" class="pipe cold" id="svg_73" transform="rotate(90.0111, 215.695, 289.597)"/>
        </g>

        <!-- Cold tap water supply pipes. -->
        <g id="svg_126">
         <path d="m255.93,289.13l0,189.49" class="pipe cold" id="svg_86"/>
         <path d="m253.23,286.87l0,4.59" class="pipe cold" id="svg_88" transform="rotate(90.0111, 253.23, 289.169)"/>
         <path d="m283.04,386.62l0,48.64" class="pipe cold" id="svg_106" transform="rotate(90.0111, 283.044, 410.944)"/>
        </g>

        <!-- Hot tap water outlet pipes. -->
        <g id="svg_125">
         <path d="m267.23,222.95l0,33.99" class="pipe hot" id="svg_87" transform="rotate(90, 267.233, 239.944)"/>
         <path d="m285.01,240.73l0,161.56" class="pipe hot" id="svg_89"/>
         <path d="m296.26,391.4l0,21.89" class="pipe hot" id="svg_105" transform="rotate(90, 296.256, 402.345)"/>
        </g>

        <!-- Main internal heating block. -->
        <rect x="97.05" y="150.8" width="79.26" height="56.09" rx="6" fill="#a3a3a3" stroke="#7f7f7f" stroke-width="1.2" id="svg_4"/>

        <!-- Gas supply pipework. -->
        <g id="svg_124">
         <path d="m117.05,218.76l38.04,0" class="pipe gas" id="svg_58" transform="rotate(90, 136.072, 218.759)"/>
         <path d="m43.62,238.89l92.12,0" class="pipe gas" id="svg_12"/>
        </g>

        <!-- Upper internal heat block. -->
        <rect x="118.65" y="90.78" width="138" height="51" rx="5" fill="#edf1f6" stroke="#c4cfdb" stroke-width="1.2" id="svg_19"/>

        <!-- Internal pipe details and lower boiler connections. -->
        <path d="m136.91,367.57l0,6.5" class="pipe cold" id="svg_55"/>
        <path d="m92.93,56.37l188,0" stroke="#e0e6ed" stroke-width="2" id="svg_16"/>

        <!-- Boiler branding. -->
        <text x="180" y="94" text-anchor="middle" fill="#26374b" font-size="13" font-weight="750" id="svg_17" transform="matrix(1, 0, 0, 1, 5.67178, -21.3033)">NEFIT</text>
        <text x="180" y="108" text-anchor="middle" fill="#65758a" font-size="9" id="svg_18" transform="matrix(1, 0, 0, 1, 7.76383, -23.8137)">TRENDLINE II</text>

        <!-- Radiator body and individual radiator panels. -->
        <rect x="56.05" y="459.43" width="110" height="65" rx="5" fill="#ffffff" stroke="#adadad" stroke-width="1.5" id="svg_31"/>
        <rect x="63.05" y="467.43" width="13" height="49" rx="2" fill="none" stroke="#adadad" stroke-width="1.5" id="svg_32"/>
        <rect x="83.05" y="467.43" width="13" height="49" rx="2" fill="none" stroke="#adadad" stroke-width="1.5" id="svg_33"/>
        <rect x="103.05" y="467.43" width="13" height="49" rx="2" fill="none" stroke="#adadad" stroke-width="1.5" id="svg_34"/>
        <rect x="123.05" y="467.43" width="13" height="49" rx="2" fill="none" stroke="#adadad" stroke-width="1.5" id="svg_35"/>
        <rect x="143.05" y="467.43" width="13" height="49" rx="2" fill="none" stroke="#adadad" stroke-width="1.5" id="svg_36"/>

