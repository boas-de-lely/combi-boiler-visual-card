          <line fill="none" stroke="#d6d6d6" stroke-width="1.5" x1="110" y1="230" x2="164" y2="230" id="svg_10"/>
          <line fill="none" stroke="#d6d6d6" stroke-width="1.5" x1="110" y1="237" x2="164" y2="237" id="svg_25"/>
          <path fill="none" stroke="#d6d6d6" stroke-width="1.5" d="m168.1,236.94c-3.2,0.14 -4.6,-1.1 -4.5,-2.75c0.1,-1.65 -0.1,-4.39 4.58,-4.23" id="svg_26" transform="rotate(177.718, 165.893, 233.45)"/>
          <line fill="none" stroke="#d6d6d6" stroke-width="1.5" x1="110" y1="244" x2="164" y2="244" id="svg_27"/>
          <line fill="none" stroke="#d6d6d6" stroke-width="1.5" x1="109.89" y1="250.95" x2="163.89" y2="250.95" id="svg_28"/>
          <line fill="none" stroke="#d6d6d6" stroke-width="1.5" x1="110.19" y1="257.95" x2="169.51" y2="257.95" id="svg_29"/>
          <path fill="none" stroke="#d6d6d6" stroke-width="1.5" d="m168.02,250.87c-3.2,0.14 -4.6,-1.1 -4.5,-2.75c0.1,-1.65 -0.1,-4.39 4.58,-4.23" id="svg_30" transform="rotate(177.718, 165.804, 247.385)"/>
          <path fill="none" stroke="#d6d6d6" stroke-width="1.5" d="m110.22,243.97c-3.2,0.14 -4.6,-1.1 -4.5,-2.75c0.1,-1.65 -0.1,-4.39 4.58,-4.23" id="svg_37" transform="rotate(1.70875, 108.004, 240.485)"/>
          <path fill="none" stroke="#d6d6d6" stroke-width="1.5" d="m110.32,257.97c-3.2,0.14 -4.6,-1.1 -4.5,-2.75c0.1,-1.65 -0.1,-4.39 4.58,-4.23" id="svg_44" transform="rotate(-0.108259, 108.104, 254.485)"/>
